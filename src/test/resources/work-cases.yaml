json-book: '{"language": "eng", "pieces": [{"number": 1, "title": "First poem", "lines": ["The first line."]}], "parts": [{"title": "Opening poems", "summary": "The first part.", "first": 1, "last": 1}], "free": [1], "stage_field": {"untouched_below": 0.001, "begun_below": 0.5, "most_below": 1.0}, "difficult_words": {"score_threshold": 3}}'
cases:
  - case: a JSON book is read as it is written
    fixture: json-book
    read: {numbers: [1], titles: [First poem], lines: [The first line.], parts: [[1, 1]], free: [1], bands: [0.001, 0.5, 1.0], threshold: 3}
  - case: a JSON threshold written as 5.0 is the whole number 5
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": 5.0'
    read: {threshold: 5}
  - case: a JSON threshold written as 1e2 is the whole number 100
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": 1e2'
    read: {threshold: 100}
  - case: a JSON piece number written as 1.0 is piece 1
    fixture: json-book
    replace: '"number": 1'
    with: '"number": 1.0'
    read: {numbers: [1]}
  - case: a JSON part bound written as 1.0 is read
    fixture: json-book
    replace: '"last": 1'
    with: '"last": 1.0'
    read: {parts: [[1, 1]]}
  - case: a JSON threshold of 5.5 is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": 5.5'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON threshold a hair above a whole number is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": 5.000000000000000001'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON threshold a hair below a whole number is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": 4.9999999999999999999'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON free piece a hair below one is refused
    fixture: json-book
    replace: '"free": [1]'
    with: '"free": [0.99999999999999999999]'
    error: invalidNumber
    refused: "The work's free[0] is not a whole number that fits in 32 bits."
  - case: a JSON threshold a hair above the largest 32-bit number is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": 2147483647.0000001'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON threshold of 1e400 is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": 1e400'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON threshold past 32 bits is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": 2147483648'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON threshold given as the string "5" is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": "5"'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON threshold given as true is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": true'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON threshold given as null is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": null'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON threshold given as a list is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": [5]'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON number written as -0 is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": -0'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON number written as -0.0 is refused
    fixture: json-book
    replace: '"score_threshold": 3'
    with: '"score_threshold": -0.0'
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a JSON free piece given as the string "1" is refused, naming the entry
    fixture: json-book
    replace: '"free": [1]'
    with: '"free": ["1"]'
    error: invalidNumber
    refused: "The work's free[0] is not a whole number that fits in 32 bits."
  - case: a JSON cut of 1.5 is refused, naming the piece's cut
    fixture: json-book
    replace: '"lines": ["The first line."]'
    with: '"lines": ["The first line."], "cuts": {"block": [1.5]}'
    error: invalidNumber
    refused: "The work's pieces[0].cuts.block[0] is not a whole number that fits in 32 bits."
  - case: a JSON piece title given as null is refused, naming the field
    fixture: json-book
    replace: '"title": "First poem"'
    with: '"title": null'
    error: nullText
    refused: "The work's pieces[0].title is null where text belongs; an empty text is written as \"\"."
  - case: a JSON line written as an empty string is a blank line
    fixture: json-book
    replace: '"lines": ["The first line."]'
    with: '"lines": ["", "The first line."]'
    read: {lines: ["", The first line.]}
  - case: a JSON fraction given as a string is refused, naming the field
    fixture: json-book
    replace: '"begun_below": 0.5'
    with: '"begun_below": "0.5"'
    error: invalidFraction
    refused: "The work's stage_field.begun_below is not a decimal number written as plain digits."
  - case: a JSON fraction given as true is refused
    fixture: json-book
    replace: '"begun_below": 0.5'
    with: '"begun_below": true'
    error: invalidFraction
    refused: "The work's stage_field.begun_below is not a decimal number written as plain digits."
  - case: a JSON fraction given as null is refused
    fixture: json-book
    replace: '"begun_below": 0.5'
    with: '"begun_below": null'
    error: invalidFraction
    refused: "The work's stage_field.begun_below is not a decimal number written as plain digits."
  - case: a JSON fraction written with an exponent is read by its value
    fixture: json-book
    replace: '"begun_below": 0.5'
    with: '"begun_below": 25e-2'
    read: {bands: [0.001, 0.25, 1.0]}
  - case: a cut written as -0 is refused
    fixture: book-with-listening
    replace: "    lines: [The first line.]\n"
    with: "    lines: [The first line.]\n    cuts:\n      block: [-0]\n"
    error: invalidNumber
    refused: "The work's pieces[0].cuts.block[0] is not a whole number that fits in 32 bits."
  - case: a threshold written as -0 is refused
    fixture: book-with-listening
    replace: "  score_threshold: 3\n"
    with: "  score_threshold: -0\n"
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a part bound written as -0 is refused
    fixture: book-with-listening
    replace: "    first: 1\n"
    with: "    first: -0\n"
    error: invalidNumber
    refused: "The work's parts[0].first is not a whole number that fits in 32 bits."
  - case: a threshold written as 0 is the number zero
    fixture: book-with-listening
    replace: "  score_threshold: 3\n"
    with: "  score_threshold: 0\n"
    error: invalidDifficultWordThreshold
    refused: "The difficult-word score threshold must be positive."
  - case: a negative threshold is a number, refused only for being below one
    fixture: book-with-listening
    replace: "  score_threshold: 3\n"
    with: "  score_threshold: -3\n"
    error: invalidDifficultWordThreshold
    refused: "The difficult-word score threshold must be positive."
  - case: a cut size written as a list is refused rather than read as its item
    fixture: book-with-listening
    replace: "    lines: [The first line.]\n"
    with: "    lines: [The first line.]\n    cuts:\n      block: [[1]]\n"
    error: invalidNumber
    refused: "The work's pieces[0].cuts.block[0] is not a whole number that fits in 32 bits."
  - case: a piece number written as a mapping is refused
    fixture: book-with-listening
    replace: "  - number: 1\n"
    with: "  - number: {value: 1}\n"
    error: invalidNumber
    refused: "The work's pieces[0].number is not a whole number that fits in 32 bits."
  - case: a part bound written as a list is refused
    fixture: book-with-listening
    replace: "    last: 1\n"
    with: "    last: [1]\n"
    error: invalidNumber
    refused: "The work's parts[0].last is not a whole number that fits in 32 bits."
  - case: a free piece written as null is refused
    fixture: book-with-listening
    replace: "free: [1]\n"
    with: "free: [null]\n"
    error: invalidNumber
    refused: "The work's free[0] is not a whole number that fits in 32 bits."
  - case: a threshold left empty is refused
    fixture: book-with-listening
    replace: "  score_threshold: 3\n"
    with: "  score_threshold:\n"
    error: invalidNumber
    refused: "The work's difficult_words.score_threshold is not a whole number that fits in 32 bits."
  - case: a work file threshold written as a mapping is refused
    fixture: work
    replace: "  difficult_word_score: 3\n"
    with: "  difficult_word_score: {score: 3}\n"
    error: invalidNumber
    refused: "The work's reading.difficult_word_score is not a whole number that fits in 32 bits."
  - case: a work file cut size written as a list is refused
    fixture: work
    replace: "            - 2\n"
    with: "            - [2]\n"
    error: invalidNumber
    refused: "The work's sections[0].pieces[0].cuts.block[0] is not a whole number that fits in 32 bits."
  - case: a piece title written as ~ is refused as null, not read as a tilde
    fixture: book-with-listening
    replace: "    title: First poem\n"
    with: "    title: ~\n"
    error: nullText
    refused: "The work's pieces[0].title is null where text belongs; an empty text is written as \"\"."
  - case: a line written as null is refused, naming the line
    fixture: book-with-listening
    replace: "    lines: [The first line.]\n"
    with: "    lines: [The first line., null]\n"
    error: nullText
    refused: "The work's pieces[0].lines[1] is null where text belongs; an empty text is written as \"\"."
  - case: a line left empty after its dash is refused, naming the line
    fixture: book-with-listening
    replace: "    lines: [The first line.]\n"
    with: "    lines:\n      - The first line.\n      -\n"
    error: nullText
    refused: "The work's pieces[0].lines[1] is null where text belongs; an empty text is written as \"\"."
  - case: a part summary left empty is refused, naming the field
    fixture: book-with-listening
    replace: "    summary: The first part.\n"
    with: "    summary:\n"
    error: nullText
    refused: "The work's parts[0].summary is null where text belongs; an empty text is written as \"\"."
  - case: a language written as null is refused, naming the field
    fixture: book-with-listening
    replace: "language: eng\n"
    with: "language: null\n"
    error: nullText
    refused: "The work's language is null where text belongs; an empty text is written as \"\"."
  - case: a line written as "" is a blank line
    fixture: book-with-listening
    replace: "    lines: [The first line.]\n"
    with: "    lines: ['', The first line.]\n"
    read: {lines: ["", The first line.]}
  - case: a work file piece title left empty is refused, naming the field
    fixture: work
    replace: "        title: Sonnet 2\n"
    with: "        title:\n"
    error: nullText
    refused: "The work's sections[0].pieces[1].title is null where text belongs; an empty text is written as \"\"."
  - case: a work file piece identifier written as null is refused as null text
    fixture: work
    replace: "id: '3'"
    with: "id: null"
    error: nullText
    refused: "The work's sections[1].pieces[0].id is null where text belongs; an empty text is written as \"\"."
  - case: a fraction in quotes is refused, naming the field
    fixture: book-with-listening
    replace: "  untouched_below: 0.001\n"
    with: "  untouched_below: '0.001'\n"
    error: invalidFraction
    refused: "The work's stage_field.untouched_below is not a decimal number written as plain digits."
  - case: a fraction written with an underscore is refused
    fixture: book-with-listening
    replace: "  begun_below: 0.5\n"
    with: "  begun_below: 0.5_0\n"
    error: invalidFraction
    refused: "The work's stage_field.begun_below is not a decimal number written as plain digits."
  - case: a fraction written as sexagesimal is refused
    fixture: book-with-listening
    replace: "  most_below: 1.0\n"
    with: "  most_below: 1:00\n"
    error: invalidFraction
    refused: "The work's stage_field.most_below is not a decimal number written as plain digits."
  - case: a fraction written with an exponent is refused in YAML
    fixture: book-with-listening
    replace: "  begun_below: 0.5\n"
    with: "  begun_below: 5e-1\n"
    error: invalidFraction
    refused: "The work's stage_field.begun_below is not a decimal number written as plain digits."
  - case: a fraction written without its leading zero is refused
    fixture: book-with-listening
    replace: "  begun_below: 0.5\n"
    with: "  begun_below: .5\n"
    error: invalidFraction
    refused: "The work's stage_field.begun_below is not a decimal number written as plain digits."
  - case: a work file fraction in quotes is refused, naming the field
    fixture: work
    replace: "  untouched_below: 0.001\n"
    with: "  untouched_below: '0.001'\n"
    error: invalidFraction
    refused: "The work's reading.untouched_below is not a decimal number written as plain digits."
  - case: a fraction written in plain digits is read by its value
    fixture: book-with-listening
    replace: "  begun_below: 0.5\n"
    with: "  begun_below: 0.25\n"
    read: {bands: [0.001, 0.25, 1.0]}
  - case: a bound written as a whole number is read as that fraction
    fixture: book-with-listening
    replace: "  most_below: 1.0\n"
    with: "  most_below: 1\n"
    read: {bands: [0.001, 0.5, 1.0]}
  - case: a piece identifier written with + is refused
    fixture: work
    replace: "id: '3'"
    with: "id: '+3'"
    error: pieceIsNotNumbered
    refused: "The work calls a piece +3, which is not a number."
  - case: a piece identifier written with a leading zero is refused
    fixture: work
    replace: "id: '3'"
    with: "id: '03'"
    error: pieceIsNotNumbered
    refused: "The work calls a piece 03, which is not a number."
  - case: a piece identifier written as -0 is refused
    fixture: work
    replace: "id: '3'"
    with: "id: '-0'"
    error: pieceIsNotNumbered
    refused: "The work calls a piece -0, which is not a number."
  - case: a piece identifier with a space around it is refused
    fixture: work
    replace: "id: '3'"
    with: "id: ' 3'"
    error: pieceIsNotNumbered
    refused: "The work calls a piece  3, which is not a number."
  - case: a free piece written with + is refused
    fixture: work
    replace: "    - '1'\n"
    with: "    - '+1'\n"
    error: pieceIsNotNumbered
    refused: "The work calls a piece +1, which is not a number."
  - case: a piece identifier written as a bare integer is read
    fixture: work
    replace: "id: '3'"
    with: "id: 3"
    read: {numbers: [1, 2, 3], titles: [Sonnet 1, Sonnet 2, Sonnet 3], parts: [[1, 2], [3, 3]], free: [1, 2], threshold: 3}
  - case: a piece identified as 0 is refused as out of order, not as a part out of range
    fixture: work
    replace: "id: '1'"
    with: "id: '0'"
    error: outOfOrder
    refused: "Expected piece 1, found 0."
  - case: a book piece numbered 0 is refused as out of order
    fixture: book-with-listening
    replace: "  - number: 1\n"
    with: "  - number: 0\n"
    error: outOfOrder
    refused: "Expected piece 1, found 0."
  - case: a work without pieces has no piece to be free, so its free list is refused
    fixture: book-with-listening
    replace: "pieces:\n  - number: 1\n    title: First poem\n    lines: [The first line.]\nparts:\n  - title: Opening poems\n    summary: The first part.\n    first: 1\n    last: 1\n"
    with: "pieces: []\nparts: []\n"
    error: invalidFreePieces
    refused: "The list of pieces free to read is empty, repeated, or outside the work."
  - case: a work without pieces and without free pieces is refused for the empty list
    fixture: book-with-listening
    replace: "pieces:\n  - number: 1\n    title: First poem\n    lines: [The first line.]\nparts:\n  - title: Opening poems\n    summary: The first part.\n    first: 1\n    last: 1\nfree: [1]\n"
    with: "pieces: []\nparts: []\nfree: []\n"
    error: invalidFreePieces
    refused: "The list of pieces free to read is empty, repeated, or outside the work."
  - case: an anchor on a piece title is refused, naming the field
    fixture: book-with-listening
    replace: "    title: First poem\n"
    with: "    title: &poem First poem\n"
    error: yamlReference
    refused: "The work's pieces[0].title is written with a YAML anchor, alias or merge key; a work writes each value out where it belongs."
  - case: a number taken from an alias is refused at its anchor
    fixture: book-with-listening
    replace: "    first: 1\n    last: 1\n"
    with: "    first: &one 1\n    last: *one\n"
    error: yamlReference
    refused: "The work's parts[0].first is written with a YAML anchor, alias or merge key; a work writes each value out where it belongs."
  - case: an anchor on a mapping is refused, naming the mapping
    fixture: book-with-listening
    replace: "difficult_words:\n"
    with: "difficult_words: &words\n"
    error: yamlReference
    refused: "The work's difficult_words is written with a YAML anchor, alias or merge key; a work writes each value out where it belongs."
  - case: a merge key in a part is refused, naming the part
    fixture: book-with-listening
    replace: "  - title: Opening poems\n"
    with: "  - <<: {short: Opening}\n    title: Opening poems\n"
    error: yamlReference
    refused: "The work's parts[0] is written with a YAML anchor, alias or merge key; a work writes each value out where it belongs."
  - case: an anchor in a work file is refused, naming the field
    fixture: work
    replace: "reading:\n"
    with: "reading: &reading\n"
    error: yamlReference
    refused: "The work's reading is written with a YAML anchor, alias or merge key; a work writes each value out where it belongs."
  - case: a merge key in a work file section is refused, naming the section
    fixture: work
    replace: "  - title: The Fair Youth\n"
    with: "  - <<: {short: Fair}\n    title: The Fair Youth\n"
    error: yamlReference
    refused: "The work's sections[1] is written with a YAML anchor, alias or merge key; a work writes each value out where it belongs."
  - case: a << key in quotes is refused as a merge key too
    fixture: book-with-listening
    replace: "  - title: Opening poems\n"
    with: "  - '<<': {short: Opening}\n    title: Opening poems\n"
    error: yamlReference
    refused: "The work's parts[0] is written with a YAML anchor, alias or merge key; a work writes each value out where it belongs."
